name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      # a small end-to-end smoke run of the whole pipeline
      - run: uv run typeone --results smoke audit --sims 200 --workers 2 --scenarios normal ratio
