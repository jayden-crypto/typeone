[project]
name = "typeone"
version = "0.1.0"
description = "Independent simulation audit of A/B-testing statistics engines (GrowthBook, Spotify confidence)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bokeh<3.10",
    "gbstats",
    "matplotlib>=3.11.2",
    "numpy<2",
    "pandas>=2.1,<3",
    "scipy>=1.17.1",
    "spotify-confidence>=4.1.0",
    "statsmodels>=0.15.0",
]

[project.scripts]
typeone = "typeone.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
gbstats = { git = "https://github.com/growthbook/growthbook", subdirectory = "packages/stats", rev = "main" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]
